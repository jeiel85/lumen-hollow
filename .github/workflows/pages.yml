name: Deploy Pages

# main에 올라온 내용을 GitHub Pages로 배포한다. 빌드는 없고, 캐시 무효화용 버전만 찍는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check import map and service worker cover every module
        run: |
          missing=0
          for f in src/*.js; do
            b=$(basename "$f")
            if ! grep -q "'src/$b'" sw.js; then
              echo "::error file=sw.js::src/$b 가 서비스 워커 MODULES에 없습니다. 오프라인에서 이 모듈을 못 찾습니다."
              missing=1
            fi
            [ "$b" = "main.js" ] && continue
            if ! grep -q "\"./src/$b\": \"./src/$b?v=__BUILD__\"" index.html; then
              echo "::error file=index.html::src/$b 가 import map에 없습니다. 캐시 무효화가 적용되지 않습니다."
              missing=1
            fi
          done
          # manifest id는 출처(jeiel85.github.io) 기준으로 풀린다. "./"이면 같은 출처의 다른 앱과 겹쳐 Chrome이 이미 설치된 앱으로 본다.
          grep -q '"id": "/lumen-hollow/"' manifest.webmanifest || { echo '::error file=manifest.webmanifest::manifest id는 "/lumen-hollow/"여야 합니다(DECISIONS.md 참고).'; missing=1; }
          for f in manifest.webmanifest icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png docs/mobile.jpg; do
            [ -f "$f" ] || { echo "::error::$f 가 없습니다(PWA 설치·오프라인 캐시에 필요)."; missing=1; }
          done
          exit $missing

      - name: Stamp build id
        run: |
          build="${GITHUB_SHA::8}"
          for f in index.html sw.js; do
            grep -q "__BUILD__" "$f" || { echo "::error file=$f::__BUILD__ 표식이 없습니다."; exit 1; }
          done
          mkdir -p _site
          cp -r index.html style.css favicon.svg manifest.webmanifest sw.js icons src vendor docs _site/
          sed -i "s/__BUILD__/${build}/g" _site/index.html _site/sw.js
          if grep -q "__BUILD__" _site/index.html _site/sw.js; then echo "::error::__BUILD__ 치환 실패"; exit 1; fi
          echo "build id: ${build}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
