name: Server tests

# 공유 보급품 서버의 규칙 테스트와, 마을 생성이 서버의 슬롯 표와 어긋나지 않는지 확인한다.
# 테스트는 Node 내장 기능(node:test, node:sqlite)만 써서 의존성을 설치하지 않는다.
on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/world.js'
      - 'src/slots.js'
      - 'src/geometry.js'
      - 'src/rng.js'
      - '.github/workflows/server-test.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/world.js'
      - 'src/slots.js'
      - 'src/geometry.js'
      - 'src/rng.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run server tests
        working-directory: server
        run: npm test
