# Lumen Hollow 공유 보급품 API. 배포 순서는 server/README.md 참고.
name = "lumen-hollow-caches"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# CORS 허용 출처(쉼표 구분). 남용 방지 수단이 아니라 브라우저 호출 허용 목록이다.
# 운영에는 배포 주소만 둔다. 로컬에서 돌린 게임이 운영 기록(성공 지표)을 오염시키지 않게 하기 위해서다.
# 로컬 개발용 출처는 .dev.vars의 ALLOWED_ORIGINS가 이 값을 덮어쓴다(.dev.vars.example 참고).
ALLOWED_ORIGINS = "https://jeiel85.github.io"
# 2단계 남용 대응(docs/online-caches.md 10절). 남용이 실제로 보일 때만 "true"로 바꿔 배포한다. 기본은 끔.
# RUN_TOKEN_REQUIRED: 두기 요청에 판 토큰(목록 응답의 runToken)이 있어야 하고, 받은 지 3분 뒤부터만 받는다.
# HUMAN_CHECK_REQUIRED: 두기 요청에 Turnstile 토큰(humanToken)이 있어야 한다. 비밀값 TURNSTILE_SECRET도 넣어야 한다.
# 클라이언트가 두 값을 보내도록 바뀐 뒤에 켠다(server/README.md '2단계 남용 대응 켜기').
RUN_TOKEN_REQUIRED = "false"
HUMAN_CHECK_REQUIRED = "false"

[[d1_databases]]
binding = "DB"
database_name = "lumen-hollow-caches"
# 운영 D1(2026-11-06 생성, 위치 APAC). 로컬 개발(--local)은 이 값을 쓰지 않는다.
database_id = "e0949202-1be3-4d95-ab6d-b0af5f18e1c0"
# 스키마 변경: npx wrangler d1 migrations apply lumen-hollow-caches --remote (server/README.md '스키마 바꾸기')
migrations_dir = "migrations"

# 분당 요청 한도(IP 해시 기준, 근사치이며 Cloudflare 위치마다 따로 센다). 하루 한도는 D1(rate_daily)이 엄격하게 센다.
# namespace_id는 이 계정 안에서 카운터를 구분하는 임의의 정수다.
# 선택 기능이다: 무료 플랜에서 배포가 이 블록 때문에 거절되면 두 블록을 지우고 배포한다(코드는 없어도 동작한다).
[[ratelimits]]
name = "RL_READ"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

# 하루 한 번 정리 작업(UTC 03:17): 만료 표시 → 집계 → 90일 지난 기록 삭제
[triggers]
crons = ["17 3 * * *"]

# Workers Logs(저장되는 로그)는 끈다. 2026-12-01부터 Cloudflare Observability 요금 체계로 바뀔 예정이라
# 비용 위험을 남기지 않는다. 요청 수·오류율 같은 기본 지표는 대시보드에서 계속 보이고, 실시간 로그는 `npx wrangler tail`로 본다.
[observability]
enabled = false
